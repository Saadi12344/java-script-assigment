<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | MySite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">MySite</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>Contact Us</h1>
    <p>Have a question or feedback? Reach out using the form below.</p>
  </section>

  <section class="contact-info">
    <div class="info-item">
      <strong>Email</strong>
      <span>hello@mysite.example.com</span>
    </div>
    <div class="info-item">
      <strong>Phone</strong>
      <span>+92 300 0000000</span>
    </div>
    <div class="info-item">
      <strong>Location</strong>
      <span>Karachi, Pakistan</span>
    </div>
  </section>

  <section>
    <h2>Send a Message</h2>
    <form id="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit">Send Message</button>
      <p id="form-status"></p>
    </form>
  </section>
</main>

<footer>
  &copy; 2026 MySite. Built for a web development course assignment.
</footer>

<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();

    // This is a static demo form (no backend), so we just confirm on-page.
    status.textContent = `Thanks, ${name}! Your message has been noted (demo form — not actually sent).`;
    status.style.color = '#1b4332';
    form.reset();
  });
</script>

</body>
</html>
